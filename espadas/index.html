<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de espadas y sables</title>
<style>
  :root{--bg:#0f1114;--card:#181b20;--line:#262a31;--txt:#eceff3;--mut:#9aa3af;--acc:#e0a526}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button{font-family:inherit}
  .top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .top h1{margin:0;font-size:22px;white-space:nowrap}
  .q{flex:1;min-width:0;max-width:340px;margin-left:auto;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px}
  main{max-width:1280px;margin:auto;padding:16px}
  .count{color:var(--mut);font-size:14px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;padding:0;text-align:left;color:inherit}
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc);outline:none}
  .card .ph{position:relative}
  .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
  .card .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);font-size:12px;padding:2px 8px;border-radius:99px}
  .card .b{padding:10px 12px 12px}
  .code{font-weight:700;font-size:14px}
  .muted{color:var(--mut);font-size:13px}
  .empty{color:var(--mut);padding:30px 0}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .ov.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:820px;max-height:95vh;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line)}
  @media(min-width:900px){.ov{align-items:center}.sheet{border-radius:18px}}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
  .head h2{margin:0;font-size:18px}
  .x{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000}
  .gal img{flex:0 0 100%;width:100%;max-height:70vh;object-fit:contain;scroll-snap-align:center}
  .thumbs{display:flex;gap:6px;padding:10px 16px 16px;overflow-x:auto}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none;opacity:.7}
  .thumbs img.on{border-color:var(--acc);opacity:1}
  .pos{color:var(--mut);font-size:13px;padding:0 16px 4px}
</style>
</head>
<body>
<div class="top">
  <h1>Espadas y sables</h1>
  <input class="q" id="q" type="search" placeholder="Buscar" aria-label="Buscar">
</div>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="head"><h2 id="mt"></h2><button class="x" id="close">Cerrar</button></div>
    <div class="gal" id="gal"></div>
    <div class="pos" id="pos"></div>
    <div class="thumbs" id="thumbs"></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const base=c=>encodeURIComponent(c.carpeta);
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function render(){
  const t=norm($("q").value.trim());
  const list=CATALOGO.filter(c=>!t||norm(c.titulo+" "+c.id).includes(t));
  $("count").textContent=list.length+" modelos";
  $("grid").innerHTML=list.length?"":'<div class="empty">No hay modelos con esa búsqueda.</div>';
  list.forEach(c=>{
    const b=document.createElement("button");b.className="card";
    b.innerHTML=`<div class="ph"><img loading="lazy" alt="${c.titulo}" src="mini/${base(c)}/${c.fotos[0]}.webp"><span class="n">${c.fotos.length} fotos</span></div><div class="b"><div class="code">${c.titulo}</div><div class="muted">Modelo ${c.id}</div></div>`;
    b.onclick=()=>open(c);$("grid").appendChild(b);
  });
}
function open(c){
  $("mt").textContent=c.titulo;
  $("gal").innerHTML=c.fotos.map(f=>`<img loading="lazy" alt="${c.titulo}" src="fotos/${base(c)}/${f}.jpg">`).join("");
  $("thumbs").innerHTML=c.fotos.map((f,i)=>`<img alt="Foto ${i+1}" data-i="${i}" src="mini/${base(c)}/${f}.webp">`).join("");
  $("gal").scrollLeft=0;mark(0,c.fotos.length);
  $("ov").classList.add("on");document.body.style.overflow="hidden";
}
function mark(i,n){
  $("pos").textContent=(i+1)+" de "+n;
  [...$("thumbs").children].forEach((t,k)=>t.classList.toggle("on",k===i));
}
$("gal").addEventListener("scroll",()=>{
  const g=$("gal"),n=g.children.length;mark(Math.round(g.scrollLeft/g.clientWidth),n);
});
$("thumbs").addEventListener("click",e=>{
  const i=e.target.dataset.i;if(i==null)return;
  $("gal").scrollTo({left:i*$("gal").clientWidth,behavior:"smooth"});
});
function closeM(){$("ov").classList.remove("on");document.body.style.overflow=""}
$("close").onclick=closeM;
$("ov").onclick=e=>{if(e.target===$("ov"))closeM()};
document.addEventListener("keydown",e=>{
  if(!$("ov").classList.contains("on"))return;
  if(e.key==="Escape")closeM();
  const g=$("gal");
  if(e.key==="ArrowRight")g.scrollBy({left:g.clientWidth,behavior:"smooth"});
  if(e.key==="ArrowLeft")g.scrollBy({left:-g.clientWidth,behavior:"smooth"});
});
$("q").addEventListener("input",render);
render();
</script>
</body>
</html>
